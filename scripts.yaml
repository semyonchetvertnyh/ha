notify:
  alias: Notify
  description: >-
    Sends a notification to residents: title is the category (ru for Semyon, ua for
    Iryna), message is the description as is (description_ua for Iryna).
  fields:
    category:
      name: Category
      description: Notification category, shown as the title.
      required: true
      selector:
        select:
          options:
            - label: 💧 Влажность
              value: humidity
            - label: 🔋 Зарядка
              value: battery
            - label: ☕ Кофе
              value: coffee
            - label: 🍽️ Посудомойка
              value: dishwasher
            - label: 🌀 Сушилка
              value: dryer
            - label: 🧺 Стирка
              value: washer
            - label: 👔 Утюг
              value: iron
            - label: ♨️ Духовка
              value: oven
            - label: 🔥 Плита
              value: stove
            - label: 🧹 Уборка
              value: vacuum
            - label: 🚿 Горячая вода
              value: water_heater
            - label: 🥤 Вода
              value: drinking_water
            - label: 🌐 Интернет
              value: internet
            - label: 🎬 Новый фильм
              value: movie
            - label: 🧸 Новый мультфильм
              value: cartoon
            - label: 📺 Сериал
              value: tv_show
            - label: 🗓️ Телепрограмма
              value: tv_guide
            - label: ⚠️ Метеоаларм
              value: meteoalarm
            - label: 🌪️ Пылевая буря
              value: dust_storm
    description:
      name: Description
      description: Notification text in Russian (also used for voice).
      required: true
      selector:
        text:
          multiline: true
    description_ua:
      name: Description (UA)
      description: Notification text in Ukrainian for Iryna. Falls back to description.
      required: false
      selector:
        text:
          multiline: true
    persons:
      name: Person(s)
      description: Specify the recipients.
      selector:
        entity:
          domain: person
          multiple: true
      required: true
    announce:
      name: Announce
      description: Toggle to enable or disable announcements.
      default: false
      selector:
        boolean:
  sequence:
  - variables:
      categories:
        humidity: ['💧 Влажность', '💧 Вологість']
        battery: ['🔋 Зарядка', '🔋 Заряджання']
        coffee: ['☕ Кофе', '☕ Кава']
        dishwasher: ['🍽️ Посудомойка', '🍽️ Посудомийка']
        dryer: ['🌀 Сушилка', '🌀 Сушарка']
        washer: ['🧺 Стирка', '🧺 Прання']
        iron: ['👔 Утюг', '👔 Праска']
        oven: ['♨️ Духовка', '♨️ Духовка']
        stove: ['🔥 Плита', '🔥 Плита']
        vacuum: ['🧹 Уборка', '🧹 Прибирання']
        water_heater: ['🚿 Горячая вода', '🚿 Гаряча вода']
        drinking_water: ['🥤 Вода', '🥤 Вода']
        internet: ['🌐 Интернет', '🌐 Інтернет']
        movie: ['🎬 Новый фильм', '🎬 Новий фільм']
        cartoon: ['🧸 Новый мультфильм', '🧸 Новий мультфільм']
        tv_show: ['📺 Сериал', '📺 Серіал']
        tv_guide: ['🗓️ Телепрограмма', '🗓️ Телепрограма']
        meteoalarm: ['⚠️ Метеоаларм', '⚠️ Метеоаларм']
        dust_storm: ['🌪️ Пылевая буря', '🌪️ Пилова буря']
      titles: "{{ categories.get(category | default(''), ['🏠 Дом', '🏠 Дім']) }}"
      title_ru: "{{ titles[0] }}"
      title_ua: "{{ titles[1] }}"
      message_semyon: "{{ description }}"
      message_iryna: "{{ description_ua | default(description, true) }}"
      message_both: "{{ description }}"
  - parallel:
    - if:
      - condition: template
        value_template: '{{ ''person.semyon'' in persons }}'
      then:
      - action: notify.persistent_notification
        data:
          title: "{{ title_ru }}"
          message: "{{ message_semyon }}"
      - action: notify.semyons_devices
        data:
          title: "{{ title_ru }}"
          message: "{{ message_semyon }}"
    - if:
      - condition: template
        value_template: '{{ ''person.iryna'' in persons }}'
      then:
      - action: notify.irynas_devices
        data:
          title: "{{ title_ua }}"
          message: "{{ message_iryna }}"
    - if:
      - condition: template
        value_template: '{{ announce | default(false) }}'
      - condition: state
        entity_id: binary_sensor.semyon_asleep
        state: 'off'
      - condition: state
        entity_id: binary_sensor.iryna_asleep
        state: 'off'
      then:
      - action: assist_satellite.announce
        target:
          entity_id:
          - assist_satellite.living_room_speakers
          - assist_satellite.semyons_bedroom_speakers
        data:
          message: "{{ message_both }}"
          preannounce: true
