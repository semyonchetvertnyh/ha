        - person.iryna
        description: 'Это {{ [irynas_overdue_bed_sheets, irynas_overdue_bed_pillowcase]
          | max }}-е напоминание.


          Использовалось дольше положенного, поэтому Ирине нужно заменить:

          {% if states(''binary_sensor.irynas_bed_sheets'') == ''on'' %}

          - постельное белье

          {% endif %}

          {% if states(''binary_sensor.irynas_bed_pillowcase'') == ''on'' %}

          - наволочку для подушки

          {% endif %}'
