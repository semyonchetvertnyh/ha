        entity_id: binary_sensor.semyons_bed_sheets
        state: 'on'
      - condition: state
        entity_id: binary_sensor.semyons_bed_pillowcase
        state: 'on'
    then:
    - variables:
        semyons_overdue_bed_pillowcase: '{{ states(''input_number.semyons_bed_pillowcase'')
          | int - 7 }}'
        semyons_overdue_bed_sheets: '{{ states(''input_number.semyons_bed_sheets'')
          | int - 14 }}'
    - action: script.notify
      metadata: {}
      data:
        announce: false
        persons:
        - person.semyon
        description: 'Это {{ [semyons_overdue_bed_sheets, semyons_overdue_bed_pillowcase]
          | max }}-е напоминание.


          Использовалось дольше положенного, поэтому Семену нужно заменить:

          {% if states(''binary_sensor.semyons_bed_sheets'') == ''on'' %}

          - постельное белье

          {% endif %}

          {% if states(''binary_sensor.semyons_bed_pillowcase'') == ''on'' %}

          - наволочку для подушки

          {% endif %}'
  mode: single
