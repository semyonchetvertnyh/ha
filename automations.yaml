- id: '1760453651233'
  alias: Entryway Lock
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - lock.entryway
    to:
    - unlocked
    - unknown
    for:
      hours: 0
      minutes: 1
      seconds: 30
  - event_type: timer.finished
    event_data:
      entity_id: timer.entryway_lock
    trigger: event
  conditions: []
  actions:
  - if:
    - condition: state
      entity_id: binary_sensor.entryway_door
      state: 'off'
    then:
    - target:
        entity_id: lock.entryway
      action: lock.lock
    - target:
        entity_id: timer.entryway_lock
      action: timer.cancel
    else:
    - target:
        entity_id: timer.entryway_lock
      action: timer.start
      data:
        duration: 00:01:30
  mode: single
