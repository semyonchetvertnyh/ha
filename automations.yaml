- id: '1759854006174'
  alias: Switch - Living Room
  description: ''
  triggers:
  - trigger: mqtt
    options:
      topic: zigbee2mqtt/Living Room Switch/action
      payload: single_button_1
    id: single_button_1
  - trigger: mqtt
    options:
      topic: zigbee2mqtt/Living Room Switch/action
      payload: single_button_2
    id: single_button_2
  - trigger: mqtt
    options:
      topic: zigbee2mqtt/Living Room Switch/action
      payload: single_button_3
    id: single_button_3
  - trigger: mqtt
    options:
      topic: zigbee2mqtt/Living Room Switch/action
      payload: single_button_4
    id: single_button_4
  - trigger: state
    entity_id: event.living_room_switch_action
    not_from: unavailable
    id: action
    enabled: false
  - trigger: time_pattern
    minutes: /15
    id: time
    enabled: false
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - action
        - single_button_1
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''button_1_single''
          }}'
        enabled: false
      sequence:
      - action: light.toggle
        target:
          entity_id: light.living_room_dining_area
      alias: If button 1 was pressed
    - conditions:
      - condition: trigger
        id:
        - action
        - single_button_2
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''button_2_single''
          }}'
        enabled: false
      sequence:
      - action: light.toggle
        target:
          entity_id: light.kitchen_ceiling
        data: {}
      alias: If button 2 was pressed
    - conditions:
      - condition: trigger
        id:
        - action
        - single_button_3
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''button_3_single''
          }}'
        enabled: false
      sequence:
      - action: light.toggle
        target:
          entity_id: light.living_room_tv_area
      alias: If button 3 was pressed
    - conditions:
      - condition: trigger
        id:
        - action
        - single_button_4
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''button_4_single''
          }}'
        enabled: false
      sequence:
      - action: light.toggle
        target:
          entity_id:
          - light.living_room_spotlight
      alias: If button 4 was pressed
    - conditions:
      - condition: trigger
        id:
        - time
      sequence:
      - variables:
          screen_saver_style: '{{ [''digital_clock'', ''weather_conditions'', ''indoor_environment'']
            | random }}

            '
          is_day: '{{ is_state(''sun.sun'', ''above_horizon'') }}'
          weather: '{{ states(''weather.forecast_home'') }}'
          weather_condition: "{% set m = {\n  'clear-night': 'clear',\n  'partlycloudy':
            'partly_cloudy',\n  'cloudy': 'overcast',\n  'fog': 'foggy',\n  'windy':
            'windy',\n  'windy-variant': 'blustery',\n  'rainy': 'moderate_rain',\n
            \ 'pouring': 'heavy_storm',\n  'hail': 'sleet',\n  'snowy-rainy': 'sleet',\n
            \ 'snowy': 'moderate_snow',\n  'lightning': 'storm',\n  'lightning-rainy':
            'severe_storm',\n  'exceptional': 'hurricane'\n} %}\n\n{% if weather ==
            'sunny' %}\n  {{ 'sunny' if is_day else 'clear' }}\n{% elif weather in
            ['unknown', 'unavailable', 'none', ''] %}\n  unknown\n{% else %}\n  {{
            m.get(weather, 'unknown') }}\n{% endif %}"
      - parallel:
        - action: mqtt.publish
          data:
            topic: zigbee2mqtt/0x54ef44100117d96a/set
            payload: "{\n  \"screen_saver_style\": \"{{ screen_saver_style }}\"\n}"
            retain: false
        - action: mqtt.publish
          data:
            topic: zigbee2mqtt/0x54ef44100117d96a/set
            payload: "{\n  \"weather_condition\": \"{{ weather_condition }}\"\n}"
            retain: false
        - action: mqtt.publish
          data:
            topic: zigbee2mqtt/0x54ef44100117d96a/set
            payload: "{\n  \"weather_temperature\": {{ state_attr('weather.forecast_home',
              'temperature') | int(0) }}\n}"
            retain: false
        - action: mqtt.publish
          data:
            topic: zigbee2mqtt/0x54ef44100117d96a/set
            payload: "{\n  \"sensor_temperature\": {{ states('sensor.living_room_temperature')
              | int(0) }}\n}"
            retain: false
  mode: parallel
  max: 10
