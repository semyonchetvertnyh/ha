  - trigger: state
    entity_id: binary_sensor.morning
    id: morning
    to: 'on'
  - trigger: state
    entity_id: binary_sensor.night
    id: night
    to: 'on'
  - trigger: state
    entity_id: zone.home
    id: residents
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id:
        - sunrise
        - morning
      sequence:
      - condition: numeric_state
        entity_id: zone.home
        above: 0
      - action: light.turn_on
        metadata: {}
        target:
          entity_id:
          - light.christmas_tree
          - light.living_room_strings
        data: {}
    - conditions:
      - condition: trigger
        id:
        - night
      sequence:
      - action: light.turn_off
        metadata: {}
        target:
          entity_id:
          - light.christmas_tree
          - light.living_room_strings
        data: {}
    - conditions:
      - condition: trigger
        id:
        - residents
      sequence:
      - if:
        - condition: numeric_state
          entity_id: zone.home
          above: 0
        then:
        - action: light.turn_on
          metadata: {}
          target:
            entity_id:
            - light.christmas_tree
            - light.living_room_strings
          data: {}
        else:
        - action: light.turn_off
