- id: '1761231836888'
  alias: Iryna’s Bedroom Air Purifier
  description: Днём - по присутствию в комнате. Ночью (с binary_sensor.night до 08:00)
    работает без перерывов, если Ира дома, экран выключен. Утром (binary_sensor.morning)
    экран включается. 08:00 - временно вручную, пока не разобрались с night/morning/quiet_hours.
  triggers:
  - id: presence
    options:
      for: 00:03:00
    target:
      entity_id: binary_sensor.irynas_bedroom_occupancy
    trigger: occupancy.detected
  - id: absence
    options:
      for: 00:15:00
    target:
      entity_id: binary_sensor.irynas_bedroom_occupancy
    trigger: occupancy.cleared
  - entity_id: person.iryna
    id: iryna_home
    to: home
    trigger: state
  - entity_id: binary_sensor.morning
    id: morning
    to: 'on'
    trigger: state
  - entity_id: binary_sensor.night
    id: night
    to: 'on'
    trigger: state
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: night
      sequence:
      - if:
        - condition: state
          entity_id: person.iryna
          state: home
        then:
        - action: fan.turn_on
          data:
            preset_mode: Auto
          target:
            entity_id: fan.irynas_bedroom_air_purifier
      - action: select.select_option
        data:
          option: 'Off'
        target:
          entity_id: select.irynas_bedroom_air_purifier_screen_brightness
    - conditions:
      - condition: trigger
        id:
        - presence
        - iryna_home
      - condition: state
        entity_id: person.iryna
        state: home
      - or:
        - condition: trigger
          id: presence
        - condition: state
          entity_id: binary_sensor.night
          state: 'on'
        - condition: time
          before: 08:00:00
      sequence:
      - action: fan.turn_on
        data:
          preset_mode: Auto
        target:
          entity_id: fan.irynas_bedroom_air_purifier
      - if:
        - or:
          - condition: state
            entity_id: binary_sensor.night
            state: 'on'
          - condition: time
            before: 08:00:00
        then:
        - action: select.select_option
          data:
            option: 'Off'
          target:
            entity_id: select.irynas_bedroom_air_purifier_screen_brightness
    - conditions:
      - condition: trigger
        id: absence
      - condition: state
        entity_id: binary_sensor.night
        state: 'off'
      - condition: time
        after: 08:00:00
      sequence:
      - action: fan.turn_off
        target:
          entity_id: fan.irynas_bedroom_air_purifier
    - conditions:
      - condition: trigger
        id: morning
      sequence:
      - action: select.select_option
        data:
          option: 'On'
        target:
          entity_id: select.irynas_bedroom_air_purifier_screen_brightness
      - if:
        - condition: state
          entity_id: binary_sensor.irynas_bedroom_occupancy
          state: 'off'
        then:
        - action: fan.turn_off
          target:
            entity_id: fan.irynas_bedroom_air_purifier
  mode: queued
