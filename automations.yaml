- id: '1773319483950'
  alias: Alarm - Sync
  description: Keeps alarm_control_panel.home, kitchen and living room camera systems
    in sync
  triggers:
  - entity_id:
    - alarm_control_panel.home
    - alarm_control_panel.kitchen_camera_security_system
    - alarm_control_panel.living_room_camera_security_system
    not_from:
    - unavailable
    - unknown
    not_to:
    - unavailable
    - unknown
    trigger: state
  conditions:
  - condition: template
    value_template: "{% set s = trigger.to_state.state %} {% set panels = [\n  'alarm_control_panel.home',\n
      \ 'alarm_control_panel.kitchen_camera_security_system',\n  'alarm_control_panel.living_room_camera_security_system'\n]
      %} {{ panels | map('states') | reject('eq', s) | list | count > 0 }}\n"
    enabled: false
  actions:
  - variables:
      new_state: '{{ trigger.to_state.state }}'
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ new_state == ''disarmed'' }}'
      - condition: template
        value_template: '{{ new_state == ''armed_home'' }}'
      sequence:
      - target:
          entity_id:
          - alarm_control_panel.home
          - alarm_control_panel.kitchen_camera_security_system
          - alarm_control_panel.living_room_camera_security_system
        action: alarm_control_panel.alarm_disarm
        data:
          code: '1234'
    - conditions:
      - condition: template
        value_template: '{{ new_state == ''armed_away'' }}'
      - condition: template
        value_template: '{{ new_state == ''armed_night'' }}'
      sequence:
      - target:
          entity_id:
          - alarm_control_panel.home
          - alarm_control_panel.kitchen_camera_security_system
          - alarm_control_panel.living_room_camera_security_system
        action: alarm_control_panel.alarm_arm_away
        data:
          code: '1234'
    - conditions:
      - condition: template
        value_template: '{{ new_state == ''triggered'' }}'
      sequence:
      - target:
          entity_id:
          - alarm_control_panel.home
          - alarm_control_panel.kitchen_camera_security_system
          - alarm_control_panel.living_room_camera_security_system
        action: alarm_control_panel.alarm_trigger
        data:
          code: '1234'
  mode: single
  max_exceeded: silent
