        above: 90
      sequence:
      - action: script.notify
        data:
          description: 'Драйвер для правой шторы в гостинной зарядился до {{ states(''sensor.living_room_shade_right_battery'')
            }}%. Можно отключить пауербанк.

            '
          persons:
          - person.semyon
          announce: false
    - conditions:
      - condition: trigger
        id: irynas_bedroom_shade
      - condition: numeric_state
        entity_id: sensor.irynas_bedroom_shade_battery
        above: 90
      sequence:
      - action: script.notify
        data:
          description: 'Драйвер для шторы в Ириной спальне зарядился до {{ states(''sensor.irynas_bedroom_shade_battery'')
            }}%. Можно отключить пауербанк.

