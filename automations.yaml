- id: '1759759807213'
  alias: Switch - Bathroom
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - event.hallway_switch_action
    not_from: unavailable
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''single_left''
          }}'
      sequence:
      - action: light.toggle
        target:
          entity_id: light.bathroom
        data: {}
    - conditions:
      - condition: template
        value_template: '{{ trigger.to_state.attributes.event_type == ''double_left''
          }}'
