timer:
  water_heater:
    name: Water Heater
    icon: mdi:water-boiler
    restore: true

input_number:
  # Аварийный предел нагрева. Связан с HomeKit (linked_valve_duration),
  # обычно нагрев заканчивается раньше - по термостату бойлера.
  water_heater_duration:
    name: Water Heater Duration
    min: 600
    max: 7200
    step: 300
    unit_of_measurement: s
    icon: mdi:water-boiler

template:
  - sensor:
      - name: Water Heater End Time
        unique_id: water_heater_end_time
        device_class: timestamp
        state: "{{ state_attr('timer.water_heater', 'finishes_at') }}"
        availability: "{{ is_state('timer.water_heater', 'active') }}"

  - binary_sensor:
      # ТЭН реально греет. Термостат бойлера отключает ТЭН циклами
      # примерно по минуте, поэтому пауза дольше 20 секунд при
      # включённом реле значит, что вода дошла до уставки.
      - name: Water Heater Heating
        unique_id: water_heater_heating
        device_class: heat
        icon: mdi:fire
        state: "{{ states('sensor.water_heater_power') | float(0) > 100 }}"
        availability: "{{ has_value('sensor.water_heater_power') }}"
        delay_off:
          seconds: 20

automation:
  - alias: Water Heating
    id: "1762005091052"
    description: >-
      Утром в прохладную погоду включает нагрев воды.
      Выключается нагрев сам - автоматизацией "Water Heater".
    mode: single
    triggers:
      - trigger: sun
        event: sunrise
        offset: "00:15:00"
    conditions:
      - condition: numeric_state
        entity_id: weather.forecast_home
        attribute: temperature
        below: 22
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.water_heater

  # Аварийный таймер на реле: старт/отмена вместе с реле, длительность из
  # input_number.water_heater_duration, по окончании выключает реле, сверка после рестарта HA.
  - alias: Timer - Water Heater
    id: water_heater_timer
    use_blueprint:
      path: semyonchetvertnyh/timer_sync_to_switch.yaml
      input:
        timer: timer.water_heater
        switch: switch.water_heater
        duration: input_number.water_heater_duration
        turn_off_when_timer_finished: true

  - alias: Water Heater
    id: water_heater_auto_off
    description: >-
      Выключает бойлер, когда вода горячая: термостат отключил ТЭН или ТЭН не
      начал греть за 2 минуты после включения. Аварийный предел (таймер) -
      в "Timer - Water Heater".
    mode: queued
    max: 10
    triggers:
      - trigger: state
        entity_id: binary_sensor.water_heater_heating
        from: "on"
        to: "off"
        id: thermostat_off
      - trigger: state
        entity_id: switch.water_heater
        to: "on"
        not_from:
          - unknown
          - unavailable
        for:
          minutes: 2
        id: not_heating
      # Рестарт HA теряет переход "ТЭН перестал греть" (сенсор приходит из unavailable)
      # и отсчёт "2 минуты не греет".
      - trigger: homeassistant
        event: start
        id: start
    actions:
      - choose:
          - alias: Рестарт HA - проверить, греет ли ТЭН
            conditions:
              - condition: trigger
                id: start
            sequence:
              - wait_template: >-
                  {{ has_value('switch.water_heater')
                     and has_value('binary_sensor.water_heater_heating') }}
                timeout: "00:02:00"
                continue_on_timeout: false
              - condition: state
                entity_id: switch.water_heater
                state: "on"
              # термостат делает паузы до ~20 с, поэтому ждём, не начнёт ли ТЭН греть
              - wait_template: "{{ is_state('binary_sensor.water_heater_heating', 'on') }}"
                timeout: "00:00:30"
              - if:
                  - condition: state
                    entity_id: binary_sensor.water_heater_heating
                    state: "off"
                then:
                  - action: switch.turn_off
                    target:
                      entity_id: switch.water_heater

          - alias: Вода горячая - выключить нагрев
            conditions:
              - condition: or
                conditions:
                  - alias: Термостат отключил ТЭН
                    condition: trigger
                    id: thermostat_off
                  - alias: ТЭН не начал греть - вода уже горячая
                    condition: and
                    conditions:
                      - condition: trigger
                        id: not_heating
                      - condition: state
                        entity_id: binary_sensor.water_heater_heating
                        state: "off"
              - condition: state
                entity_id: switch.water_heater
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.water_heater

  - alias: Notifications - Water Heater
    id: "1761907949866"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.water_heater_heating
        from: "on"
        to: "off"
        id: hot
      - trigger: state
        entity_id: switch.water_heater
        to: "on"
        not_from:
          - unknown
          - unavailable
        for:
          minutes: 2
        id: already_hot
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.water_heater
        id: too_long
    actions:
      - choose:
          - alias: Вода горячая
            conditions:
              - condition: or
                conditions:
                  - alias: Термостат отключил ТЭН при включённом реле
                    condition: trigger
                    id: hot
                  - alias: ТЭН не начал греть - вода уже горячая
                    condition: and
                    conditions:
                      - condition: trigger
                        id: already_hot
                      - condition: state
                        entity_id: binary_sensor.water_heater_heating
                        state: "off"
              - condition: state
                entity_id: switch.water_heater
                state: "on"
            sequence:
              - action: script.notify
                data:
                  category: water_heater
                  description: Вода в бойлере горячая, можно идти в душ.
                  description_ua: Вода в бойлері гаряча, можна йти в душ.
                  persons:
                    - person.semyon
                    - person.iryna
                  announce: true

          - alias: Бойлер грел весь аварийный предел, а термостат не отключился
            conditions:
              - condition: trigger
                id: too_long
              - condition: numeric_state
                entity_id: input_number.water_heater_duration
                above: 7199
            sequence:
              - action: script.notify
                data:
                  category: water_heater
                  description: >-
                    Бойлер греет уже 2 часа, а термостат так и не отключил нагрев.
                    Нагрев выключен. Скорее всего, с бойлером что-то не так -
                    вода может быть не горячей.
                  persons:
                    - person.semyon
                  announce: false

rest:
  - resource: "https://cyprus-water.appspot.com/api/percentages"
    scan_interval: 21600 # 6 часов
    sensor:
      - name: "Water Dam Level"
        unique_id: water_dam_level
        value_template: >
          {{ value_json['damNamesToPercentage']['Kouris'] | float(0) | round(3) * 100 }}
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-percent

scrape:
  - resource: https://www.seatemperature.org/europe/cyprus/limassol.htm
    scan_interval: 43200 # 12 hours
    sensor:
      - name: "Sea Temperature"
        unique_id: sea_temperature
        select: "#big-temp > span.c"
        value_template: '{{ value | replace("°C", "") | float }}'
        device_class: temperature
        unit_of_measurement: °C
        icon: mdi:pool-thermometer

      - name: "Sea Feels Like"
        unique_id: sea_feels_like
        select: "#headline > strong"
        value_template: '{{ value }}'
