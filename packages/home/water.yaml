timer:
  water_heater:
    name: Water Heater
    icon: mdi:water-boiler
    restore: true

input_number:
  # Аварийный предел нагрева. Связан с HomeKit (linked_valve_duration),
  # обычно нагрев заканчивается раньше - по термостату бойлера.
  water_heater_duration:
    name: Water Heater Duration
    min: 600
    max: 7200
    step: 300
    unit_of_measurement: s
    icon: mdi:water-boiler

input_boolean:
  water_heating_schedule:
    name: Automatic Water Heating
    icon: mdi:water-boiler-auto

template:
  - sensor:
      - name: Water Heater End Time
        unique_id: water_heater_end_time
        device_class: timestamp
        state: "{{ state_attr('timer.water_heater', 'finishes_at') }}"
        availability: "{{ is_state('timer.water_heater', 'active') }}"

  - binary_sensor:
      # ТЭН реально греет. Термостат бойлера отключает ТЭН циклами
      # примерно по минуте, поэтому пауза дольше 20 секунд при
      # включённом реле значит, что вода дошла до уставки.
      - name: Water Heater Heating
        unique_id: water_heater_heating
        device_class: heat
        icon: mdi:fire
        state: "{{ states('sensor.water_heater_power') | float(0) > 100 }}"
        availability: "{{ has_value('sensor.water_heater_power') }}"
        delay_off:
          seconds: 20

automation:
  - alias: Water Heating
    id: "1762005091052"
    description: >-
      Всё управление бойлером. Утром в пасмурную прохладную погоду включает
      нагрев (если включён input_boolean.water_heating_schedule). Выключает
      нагрев, когда термостат бойлера отключил ТЭН (вода горячая), или если
      ТЭН не начал греть за 2 минуты (вода уже горячая). Таймер на
      input_number.water_heater_duration (2 часа) - аварийный предел.
    mode: queued
    max: 10
    triggers:
      - trigger: sun
        event: sunrise
        offset: "00:15:00"
        id: schedule
      - trigger: state
        entity_id: switch.water_heater
        to: "on"
        not_from:
          - unknown
          - unavailable
        id: switch_on
      - trigger: state
        entity_id: switch.water_heater
        to: "off"
        not_from:
          - unknown
          - unavailable
        id: switch_off
      - trigger: state
        entity_id: binary_sensor.water_heater_heating
        from: "on"
        to: "off"
        id: thermostat_off
      - trigger: state
        entity_id: switch.water_heater
        to: "on"
        not_from:
          - unknown
          - unavailable
        for:
          minutes: 2
        id: not_heating
      - trigger: state
        entity_id: input_number.water_heater_duration
        not_from:
          - unknown
          - unavailable
        not_to:
          - unknown
          - unavailable
        id: duration_changed
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.water_heater
        id: timer_finished
      - trigger: event
        event_type: timer.cancelled
        event_data:
          entity_id: timer.water_heater
        id: timer_cancelled
    actions:
      - choose:
          - alias: Утренний нагрев в пасмурную прохладную погоду
            conditions:
              - condition: trigger
                id: schedule
              - condition: state
                entity_id: input_boolean.water_heating_schedule
                state: "on"
              - condition: state
                entity_id: weather.forecast_home
                state:
                  - cloudy
                  - exceptional
                  - fog
                  - hail
                  - lightning-rainy
                  - lightning
                  - partlycloudy
                  - pouring
                  - rainy
                  - snowy-rainy
                  - snowy
                  - windy-variant
                  - windy
              - condition: numeric_state
                entity_id: weather.forecast_home
                attribute: temperature
                below: 22
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.water_heater

          - alias: Реле включили - запустить аварийный таймер
            conditions:
              - condition: trigger
                id: switch_on
              - condition: state
                entity_id: timer.water_heater
                state:
                  - idle
                  - paused
            sequence:
              - action: timer.start
                target:
                  entity_id: timer.water_heater
                data:
                  duration: "{{ states('input_number.water_heater_duration') | int(7200) }}"

          - alias: Реле выключили - остановить таймер
            conditions:
              - condition: trigger
                id: switch_off
              - condition: state
                entity_id: timer.water_heater
                state:
                  - active
                  - paused
            sequence:
              - action: timer.cancel
                target:
                  entity_id: timer.water_heater

          - alias: Вода горячая - выключить нагрев
            conditions:
              - condition: or
                conditions:
                  - alias: Термостат отключил ТЭН
                    condition: trigger
                    id: thermostat_off
                  - alias: ТЭН не начал греть - вода уже горячая
                    condition: and
                    conditions:
                      - condition: trigger
                        id: not_heating
                      - condition: state
                        entity_id: binary_sensor.water_heater_heating
                        state: "off"
              - condition: state
                entity_id: switch.water_heater
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.water_heater

          - alias: Изменили длительность во время нагрева - пересчитать таймер
            conditions:
              - condition: trigger
                id: duration_changed
              - condition: state
                entity_id: timer.water_heater
                state: active
            sequence:
              - variables:
                  remaining: >-
                    {{ (as_timestamp(state_attr('timer.water_heater', 'finishes_at'))
                        - trigger.from_state.state | float(0)
                        + trigger.to_state.state | float(0)
                        - as_timestamp(now())) | int(0) }}
              - if:
                  - condition: template
                    value_template: "{{ remaining > 0 }}"
                then:
                  - action: timer.start
                    target:
                      entity_id: timer.water_heater
                    data:
                      duration: "{{ remaining }}"
                else:
                  - action: timer.finish
                    target:
                      entity_id: timer.water_heater

          - alias: Таймер вышел или его отменили - выключить нагрев
            conditions:
              - condition: trigger
                id:
                  - timer_finished
                  - timer_cancelled
              - condition: state
                entity_id: switch.water_heater
                state: "on"
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.water_heater

  - alias: Notifications - Water Heater
    id: "1761907949866"
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.water_heater_heating
        from: "on"
        to: "off"
        id: hot
      - trigger: state
        entity_id: switch.water_heater
        to: "on"
        not_from:
          - unknown
          - unavailable
        for:
          minutes: 2
        id: already_hot
      - trigger: event
        event_type: timer.finished
        event_data:
          entity_id: timer.water_heater
        id: too_long
    actions:
      - choose:
          - alias: Вода горячая
            conditions:
              - condition: or
                conditions:
                  - alias: Термостат отключил ТЭН при включённом реле
                    condition: trigger
                    id: hot
                  - alias: ТЭН не начал греть - вода уже горячая
                    condition: and
                    conditions:
                      - condition: trigger
                        id: already_hot
                      - condition: state
                        entity_id: binary_sensor.water_heater_heating
                        state: "off"
              - condition: state
                entity_id: switch.water_heater
                state: "on"
            sequence:
              - action: script.notify
                data:
                  description: Вода в бойлере горячая, можно идти в душ.
                  persons:
                    - person.semyon
                    - person.iryna
                  announce: true

          - alias: Бойлер грел весь аварийный предел, а термостат не отключился
            conditions:
              - condition: trigger
                id: too_long
              - condition: numeric_state
                entity_id: input_number.water_heater_duration
                above: 7199
            sequence:
              - action: script.notify
                data:
                  description: >-
                    Бойлер греет уже 2 часа, а термостат так и не отключил нагрев.
                    Нагрев выключен. Скорее всего, с бойлером что-то не так -
                    вода может быть не горячей.
                  persons:
                    - person.semyon
                    - person.iryna
                  announce: true

rest:
  - resource: "https://cyprus-water.appspot.com/api/percentages"
    scan_interval: 21600 # 6 часов
    sensor:
      - name: "Water Dam Level"
        unique_id: water_dam_level
        value_template: >
          {{ value_json['damNamesToPercentage']['Kouris'] | float(0) | round(3) * 100 }}
        unit_of_measurement: "%"
        state_class: measurement
        icon: mdi:water-percent
