sensor:
  - name: "Outdoor Carbon monoxide (CO)"
    unique_id: outdoor_carbon_monoxide_co
    platform: min_max
    type: max
    entity_ids:
      - sensor.kuklophoriakos_stathmos_carbon_monoxide
      - sensor.limassol_co
    round_digits: 0

  - name: "Outdoor PM₂.₅"
    unique_id: outdoor_pm2_5
    platform: min_max
    type: max
    entity_ids:
      - sensor.kuklophoriakos_stathmos_pm2_5
      - sensor.limassol_pm2_5
    round_digits: 0

  - name: "Outdoor PM₁₀"
    unique_id: outdoor_pm10
    platform: min_max
    type: max
    entity_ids:
      - sensor.kuklophoriakos_stathmos_pm10
      - sensor.limassol_pm10
    round_digits: 0

  - name: "Outdoor O₃ (Ozone)"
    unique_id: outdoor_ozone_o3
    platform: min_max
    type: max
    entity_ids:
      - sensor.kuklophoriakos_stathmos_ozone
      - sensor.limassol_o3
    round_digits: 0

  - name: "Outdoor SO₂ (Sulphur dioxide)"
    unique_id: outdoor_sulphur_dioxide_so2
    platform: min_max
    type: max
    entity_ids:
      - sensor.kuklophoriakos_stathmos_sulphur_dioxide
      - sensor.limassol_so2
    round_digits: 0

  - name: "Outdoor NO₂ (Nitrogen dioxide)"
    unique_id: outdoor_nitrogen_dioxide_no2
    platform: min_max
    type: max
    entity_ids:
      - sensor.kuklophoriakos_stathmos_nitrogen_dioxide
      - sensor.limassol_no2
    round_digits: 0

template:
  - binary_sensor:
      - name: Outdoor Dust storm
        unique_id: outdoor_dust_storm
        device_class: problem
        state: >
          {% set pm10 = states('sensor.outdoor_pm10') | float(0) %}
          {% set pm25 = states('sensor.outdoor_pm2_5') | float(0) %}
          {% set ratio = (pm25 / pm10) if pm10 > 0 else 0 %}
          {% set on_now = is_state(this.entity_id, 'on') %}

          {% set dust_on_pm10 = 100 %}    {# μg/m³, "похоже на бурю" #}
          {% set dust_off_pm10 = 70 %}    {# μg/m³, гистерезис #}
          {% set dust_ratio_max = 0.40 %} {# если PM2.5 доля слишком высокая, это может быть дым/смог #}

          {% if on_now %}
            {{ pm10 >= dust_off_pm10 }}
          {% else %}
            {{ (pm10 >= dust_on_pm10) and (ratio <= dust_ratio_max) }}
          {% endif %}
        attributes:
          pm10: "{{ states('sensor.outdoor_pm10') | float(0) }}"
          pm25: "{{ states('sensor.outdoor_pm2_5') | float(0) }}"
          pm25_pm10_ratio: >
            {% set pm10 = states('sensor.outdoor_pm10') | float(0) %}
            {% set pm25 = states('sensor.outdoor_pm2_5') | float(0) %}
            {{ (pm25 / pm10) | round(2) if pm10 > 0 else 0 }}

