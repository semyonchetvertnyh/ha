input_number:
  heating_sleep_target:
    name: "Heating - Sleep Target"
    min: 18
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

# Спальня Иры временно отключена (закомментирована) в обеих автоматизациях:
# сначала отлаживаем на спальне Семёна, потом включаем Ире, если нужно.
# После отладки обе автоматизации сливаем в одну "Heating - Sleep".
# id автоматизаций (heating_night*) оставлены прежними, чтобы сохранить метки, категорию и историю.

automation:
  - alias: "Heating - Sleep Setpoint"
    id: heating_night
    description: >
      Пока человек спит, подстраивает уставку кондиционера в его спальне по датчику у кровати.
      Кондиционер не включает и не выключает, режим не меняет: работает, только если он уже на heat.
      Шаг 1°C, гистерезис 0,5°C, не чаще раза в 15 минут. План: Notion "Ночной обогрев спален".
    mode: queued
    max: 5
    trace:
      stored_traces: 20
    triggers:
      - trigger: time_pattern
        minutes: "/15"
        note: "Регулировка раз в 15 минут: кондиционер успевает отреагировать на прошлый шаг."
      - trigger: state
        entity_id:
          - binary_sensor.semyon_asleep
          # - binary_sensor.iryna_asleep
        to: "on"
        note: "Первая подстройка сразу, как человек уснул."
      - trigger: state
        entity_id:
          - climate.semyons_bedroom_ac
          # - climate.irynas_bedroom_ac
        to: "heat"
        note: "Обогрев включили, когда человек уже спит."
    actions:
      - repeat:
          for_each:
            - climate: climate.semyons_bedroom_ac
              sensor: sensor.semyons_bedroom_temperature
              asleep: binary_sensor.semyon_asleep
              max_setpoint: 27
            # - climate: climate.irynas_bedroom_ac
            #   sensor: sensor.irynas_bedroom_temperature
            #   asleep: binary_sensor.iryna_asleep
            #   max_setpoint: 28
          sequence:
            - variables:
                target: "{{ states('input_number.heating_sleep_target') | float(21) }}"
                room: "{{ states(repeat.item.sensor) }}"
                setpoint: "{{ state_attr(repeat.item.climate, 'temperature') }}"
            - if:
                - condition: template
                  value_template: >
                    {{ is_state(repeat.item.asleep, 'on')
                       and is_state(repeat.item.climate, 'heat')
                       and is_number(room) and is_number(setpoint) }}
              then:
                - variables:
                    new_setpoint: >
                      {% set diff = target - room | float %}
                      {% set current = setpoint | float %}
                      {% if diff >= 0.5 %}
                        {{ [current + 1, repeat.item.max_setpoint] | min }}
                      {% elif diff <= -0.5 %}
                        {{ [current - 1, 18] | max }}
                      {% else %}
                        {{ current }}
                      {% endif %}
                - if:
                    - condition: template
                      value_template: "{{ new_setpoint | float != setpoint | float }}"
                  then:
                    - action: climate.set_temperature
                      target:
                        entity_id: "{{ repeat.item.climate }}"
                      data:
                        temperature: "{{ new_setpoint | float }}"

  - alias: "Heating - Sleep On/Off"
    id: heating_night_on_off
    description: >
      Уснул, человек в спальне и у кровати холоднее цели на 1°C и больше - включить обогрев
      со стартовой уставкой (дальше подстраивает "Heating - Sleep Setpoint"). Проснулся - выключить обогрев.
      Пока выключена: включим после отладки "Heating - Sleep Setpoint".
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.semyon_asleep
          # - binary_sensor.iryna_asleep
        to: "on"
        id: asleep
      - trigger: state
        entity_id:
          - binary_sensor.semyon_asleep
          # - binary_sensor.iryna_asleep
        to: "off"
        id: awake
    actions:
      - variables:
          rooms:
            binary_sensor.semyon_asleep:
              climate: climate.semyons_bedroom_ac
              sensor: sensor.semyons_bedroom_temperature
              occupancy: binary_sensor.semyons_bedroom_occupancy
              start_setpoint: 24
            # binary_sensor.iryna_asleep:
            #   climate: climate.irynas_bedroom_ac
            #   sensor: sensor.irynas_bedroom_temperature
            #   occupancy: binary_sensor.irynas_bedroom_occupancy
            #   start_setpoint: 24
          room: "{{ rooms[trigger.entity_id] }}"
          target: "{{ states('input_number.heating_sleep_target') | float(21) }}"
      - choose:
          - conditions:
              - condition: trigger
                id: asleep
              - condition: template
                value_template: >
                  {{ is_state(room.climate, 'off')
                     and is_state(room.occupancy, 'on')
                     and is_number(states(room.sensor))
                     and states(room.sensor) | float < target - 1 }}
            sequence:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ room.climate }}"
                data:
                  hvac_mode: heat
                  temperature: "{{ room.start_setpoint }}"
          - conditions:
              - condition: trigger
                id: awake
              - condition: template
                value_template: "{{ is_state(room.climate, 'heat') }}"
            sequence:
              - action: climate.turn_off
                target:
                  entity_id: "{{ room.climate }}"

  # Перенесена 11.11.2026 из UI-автоматизации "Semyons Bedroom AC LED" (id 1783934989428) без изменений логики.
  - alias: "AC LED - Sleep"
    id: ac_led_sleep
    description: >
      Гасит LED кондиционера в спальне Семёна, пока он спит: когда он уснул (semyon_asleep)
      или когда кондиционер включили, пока он спит. Раньше было по binary_sensor.night (удалён 11.11.2026).
      Триггер включения ждёт 1.5 секунды, чтобы "Semyon’s Bedroom AC LED" (packages/climate/ac_led.yaml)
      успел отметить, что LED загорелся (иначе гонка и команда не уходит).
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.semyon_asleep
        not_from: ["unavailable", "unknown"]
        to: "on"
        id: asleep
      - trigger: state
        entity_id: climate.semyons_bedroom_ac
        from: "off"
        not_to: ["unavailable", "unknown"]
        for:
          seconds: 1
          milliseconds: 500
        id: ac_on
    conditions:
      - condition: state
        entity_id: binary_sensor.semyon_asleep
        state: "on"
      - condition: climate.is_on
        target:
          entity_id: climate.semyons_bedroom_ac
        options:
          behavior: any
          for: "00:00:00"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.semyons_bedroom_ac_led
