input_number:
  heating_sleep_target:
    name: "Heating - Sleep Target"
    min: 18
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

# Спальня Иры пока не подключена.
# Температуру у кровати кондиционер получает через Follow Me ("Semyon’s Bedroom AC",
# packages/climate/semyons_bedroom_ac.yaml), поэтому уставку он держит сам.

automation:
  - alias: "Heating - Sleep On/Off"
    id: heating_night_on_off
    description: >
      Уснул, человек в спальне и у кровати холоднее цели на 1°C и больше - включить обогрев
      с уставкой, равной цели (по датчику у кровати её держит Follow Me, "Semyon’s Bedroom AC").
      Проснулся - выключить обогрев. Пока выключена.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.semyon_asleep
        to: "on"
        id: asleep
      - trigger: state
        entity_id:
          - binary_sensor.semyon_asleep
        to: "off"
        id: awake
    actions:
      - variables:
          rooms:
            binary_sensor.semyon_asleep:
              climate: climate.semyons_bedroom_ac
              sensor: sensor.semyons_bedroom_temperature
              occupancy: binary_sensor.semyons_bedroom_occupancy
          room: "{{ rooms[trigger.entity_id] }}"
          target: "{{ states('input_number.heating_sleep_target') | float(21) }}"
      - choose:
          - conditions:
              - condition: trigger
                id: asleep
              - condition: template
                value_template: >
                  {{ is_state(room.climate, 'off')
                     and is_state(room.occupancy, 'on')
                     and is_number(states(room.sensor))
                     and states(room.sensor) | float < target - 1 }}
            sequence:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ room.climate }}"
                data:
                  hvac_mode: heat
                  temperature: "{{ target }}"
          - conditions:
              - condition: trigger
                id: awake
              - condition: template
                value_template: "{{ is_state(room.climate, 'heat') }}"
            sequence:
              - action: climate.turn_off
                target:
                  entity_id: "{{ room.climate }}"
