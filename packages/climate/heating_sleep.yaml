automation:
  - alias: "Heating - Follow Me"
    id: heating_follow_me
    description: >
      Пока кондиционер в спальне греет, передаёт ему температуру датчика у кровати через Follow Me
      (script.ac_follow_me): при каждом изменении датчика и раз в 2 минуты, чтобы кондиционер
      не вернулся к своему датчику под потолком. Уставку кондиционер держит сам.
      Заменила "Heating - Sleep Setpoint". План: Notion "Кондиционер по датчику у кровати".
    mode: queued
    max: 3
    triggers:
      - trigger: state
        entity_id: sensor.semyons_bedroom_temperature
        not_to: ["unavailable", "unknown"]
      - trigger: time_pattern
        minutes: "/2"
      - trigger: state
        entity_id: climate.semyons_bedroom_ac
        to: "heat"
    conditions:
      - condition: state
        entity_id: climate.semyons_bedroom_ac
        state: "heat"
      - condition: template
        value_template: "{{ is_number(states('sensor.semyons_bedroom_temperature')) }}"
    actions:
      - action: script.ac_follow_me
        data:
          remote: remote.wi_fi_universal_remote
          temperature: "{{ states('sensor.semyons_bedroom_temperature') | float }}"

  - alias: "Heating - Sleep On/Off"
    id: heating_night_on_off
    description: >
      Уснул, человек в спальне и у кровати холоднее цели на 1°C и больше - включить обогрев
      с уставкой, равной цели (по датчику у кровати её держит Follow Me, "Heating - Follow Me").
      Проснулся - выключить обогрев. Пока выключена.
    mode: queued
    max: 5
    triggers:
      - trigger: state
        entity_id:
          - binary_sensor.semyon_asleep
        to: "on"
        id: asleep
      - trigger: state
        entity_id:
          - binary_sensor.semyon_asleep
        to: "off"
        id: awake
    actions:
      - variables:
          rooms:
            binary_sensor.semyon_asleep:
              climate: climate.semyons_bedroom_ac
              sensor: sensor.semyons_bedroom_temperature
              occupancy: binary_sensor.semyons_bedroom_occupancy
          room: "{{ rooms[trigger.entity_id] }}"
          target: "{{ states('input_number.heating_sleep_target') | float(21) }}"
      - choose:
          - conditions:
              - condition: trigger
                id: asleep
              - condition: template
                value_template: >
                  {{ is_state(room.climate, 'off')
                     and is_state(room.occupancy, 'on')
                     and is_number(states(room.sensor))
                     and states(room.sensor) | float < target - 1 }}
            sequence:
              - action: climate.set_temperature
                target:
                  entity_id: "{{ room.climate }}"
                data:
                  hvac_mode: heat
                  temperature: "{{ target }}"
          - conditions:
              - condition: trigger
                id: awake
              - condition: template
                value_template: "{{ is_state(room.climate, 'heat') }}"
            sequence:
              - action: climate.turn_off
                target:
                  entity_id: "{{ room.climate }}"

  # Перенесена 11.11.2026 из UI-автоматизации "Semyons Bedroom AC LED" (id 1783934989428) без изменений логики.
  - alias: "AC LED - Sleep"
    id: ac_led_sleep
    description: >
      Гасит LED кондиционера в спальне Семёна, пока он спит: когда он уснул (semyon_asleep)
      или когда кондиционер включили, пока он спит. Раньше было по binary_sensor.night (удалён 11.11.2026).
      Триггер включения ждёт 1.5 секунды, чтобы "Semyon’s Bedroom AC LED" (packages/climate/ac_led.yaml)
      успел отметить, что LED загорелся (иначе гонка и команда не уходит).
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.semyon_asleep
        not_from: ["unavailable", "unknown"]
        to: "on"
        id: asleep
      - trigger: state
        entity_id: climate.semyons_bedroom_ac
        from: "off"
        not_to: ["unavailable", "unknown"]
        for:
          seconds: 1
          milliseconds: 500
        id: ac_on
    conditions:
      - condition: state
        entity_id: binary_sensor.semyon_asleep
        state: "on"
      - condition: climate.is_on
        target:
          entity_id: climate.semyons_bedroom_ac
        options:
          behavior: any
          for: "00:00:00"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.semyons_bedroom_ac_led
