input_number:
  heating_sleep_target:
    name: "Heating - Sleep Target"
    min: 18
    max: 24
    step: 0.5
    unit_of_measurement: "°C"
    icon: mdi:thermometer

# Спальня Иры пока не подключена: Broadlink есть только в спальне Семёна.
# Follow Me: кондиционер (Inventor, протокол Midea, пульт RG10A) берёт комнатную температуру
# не со своего датчика под потолком, а из ИК-пакетов Follow Me. Пакеты шлёт Broadlink RM4
# с температурой датчика у кровати; уставку кондиционер держит сам.
# Коды взяты из блюпринта hamsando/HABlueprints midea_followme.yaml (по целым градусам).

script:
  ac_follow_me:
    alias: "AC - Follow Me"
    description: >
      Отправляет кондиционеру Midea ИК-пакет Follow Me с комнатной температурой (целые градусы, 12-32°C).
      Кондиционер возвращается к своему датчику, если пакетов нет несколько минут, поэтому слать регулярно.
    mode: queued
    max: 5
    fields:
      remote:
        name: Remote
        description: remote-сущность ИК-передатчика
        required: true
        selector:
          entity:
            domain: remote
      temperature:
        name: Temperature
        description: Температура в комнате, °C
        required: true
        selector:
          number:
            min: 0
            max: 40
            step: 0.1
            unit_of_measurement: "°C"
    sequence:
      - variables:
          rounded: "{{ [[temperature | float | round(0) | int, 12] | max, 32] | min }}"
