template:
  - binary_sensor:
      - name: "Cold Season"
        unique_id: cold_season
        state: >
          {{ now().month in [11, 12, 1, 2, 3] }}
        icon: mdi:snowflake

      - name: "Warm Season"
        unique_id: warm_season
        state: >
          {{ now().month in [4, 5, 6, 7, 8, 9, 10] }}
        icon: mdi:white-balance-sunny

binary_sensor:
  - platform: meteoalarm
    name: Meteoalarm
    country: "cyprus"
    province: "Cyprus"

