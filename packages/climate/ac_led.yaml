input_boolean:
  semyons_bedroom_ac_led:
    name: "Semyon’s Bedroom AC LED"

template:
  - switch:
      - name: "Semyon’s Bedroom AC LED"
        unique_id: semyons_bedroom_ac_led
        state: "{{ is_state('input_boolean.semyons_bedroom_ac_led', 'on') }}"

        turn_on:
          - if:
              - condition: state
                entity_id: input_boolean.semyons_bedroom_ac_led
                state: "off"
            then:
              - action: remote.send_command
                target:
                  entity_id: remote.wi_fi_universal_remote
                data:
                  device: semyons_bedroom_ac
                  command: toggle_led
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.semyons_bedroom_ac_led

        turn_off:
          - if:
              - condition: state
                entity_id: input_boolean.semyons_bedroom_ac_led
                state: "on"
            then:
              - action: remote.send_command
                target:
                  entity_id: remote.wi_fi_universal_remote
                data:
                  device: semyons_bedroom_ac
                  command: toggle_led
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.semyons_bedroom_ac_led

automation:
  - alias: "Semyon’s Bedroom AC LED: Sync"
    id: semyons_bedroom_ac_led_sync
    mode: restart
    triggers:
      - trigger: state
        entity_id: climate.semyons_bedroom_ac
        from: "off"
        to:
          - auto
          - cool
          - dry
          - fan_only
          - heat
        id: "on"
      - trigger: state
        entity_id: climate.semyons_bedroom_ac
        from:
          - auto
          - cool
          - dry
          - fan_only
          - heat
        to: "off"
        id: "off"
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: "on"
            sequence:
              - action: input_boolean.turn_on
                target:
                  entity_id: input_boolean.semyons_bedroom_ac_led
          - conditions:
              - condition: trigger
                id: "off"
            sequence:
              - action: input_boolean.turn_off
                target:
                  entity_id: input_boolean.semyons_bedroom_ac_led
