# Переключатели LED кондиционеров - на template-блюпринте semyonchetvertnyh/ac_led.yaml.
# LED переключается только ИК-командой toggle_led без обратной связи, поэтому состояние держит сам переключатель:
# загорается сам при включении кондиционера, гаснет при выключении.
# Гасит LED ночью автоматизация "Semyon’s Bedroom AC" (packages/climate/ac_follow_me.yaml).

template:
  - use_blueprint:
      path: semyonchetvertnyh/ac_led.yaml
      input:
        climate: climate.semyons_bedroom_ac
        remote: remote.semyons_bedroom
        device: semyons_bedroom_ac
    name: "Semyon’s Bedroom AC LED"
    unique_id: semyons_bedroom_ac_led
