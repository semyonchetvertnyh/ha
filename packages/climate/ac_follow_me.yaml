# Обёртка над кондиционером в спальне Семёна для HA и HomeKit.
# Кондиционер получает температуру у кровати через Follow Me (автоматизация "Semyon’s Bedroom AC"
# ниже в этом файле), но выключенный показывает свой датчик под потолком,
# поэтому поверх него обёртка climate.semyons_bedroom_ac с температурой у кровати,
# а сам кондиционер tuya_local переименован в climate.semyons_bedroom_ac_tuya.
# План: Notion "Кондиционер по датчику у кровати".

# Обёртка над climate.semyons_bedroom_ac_tuya: всё читает и пересылает в кондиционер,
# кроме температуры - она всегда с датчика у кровати.
# heat_cool кондиционера показываем как auto.
# Скорость вентилятора у tuya_local - отдельная fan.semyons_bedroom_ac, здесь её нет.
template:
  - climate:
      - name: "Semyon’s Bedroom AC"
        unique_id: semyons_bedroom_climate
        icon: mdi:air-conditioner
        availability: "{{ has_value('climate.semyons_bedroom_ac_tuya') }}"
        temperature_unit: "°C"
        min_temperature: 16
        max_temperature: 30
        target_temperature_step: 0.5
        precision: 0.1
        current_temperature: "{{ states('sensor.semyons_bedroom_temperature') | float(none) }}"

        hvac_modes: "{{ ['off', 'auto', 'cool', 'dry', 'fan_only', 'heat'] }}"
        hvac_mode: >
          {% set mode = states('climate.semyons_bedroom_ac_tuya') %}
          {{ 'auto' if mode == 'heat_cool' else mode }}
        set_hvac_mode:
          - action: climate.set_hvac_mode
            target:
              entity_id: climate.semyons_bedroom_ac_tuya
            data:
              hvac_mode: "{{ 'heat_cool' if hvac_mode == 'auto' else hvac_mode }}"

        target_temperature: "{{ state_attr('climate.semyons_bedroom_ac_tuya', 'temperature') }}"
        set_temperature:
          - action: climate.set_temperature
            target:
              entity_id: climate.semyons_bedroom_ac_tuya
            data:
              temperature: "{{ temperature }}"

        preset_modes: "{{ state_attr('climate.semyons_bedroom_ac_tuya', 'preset_modes') }}"
        preset_mode: "{{ state_attr('climate.semyons_bedroom_ac_tuya', 'preset_mode') }}"
        set_preset_mode:
          - action: climate.set_preset_mode
            target:
              entity_id: climate.semyons_bedroom_ac_tuya
            data:
              preset_mode: "{{ preset_mode }}"

        swing_modes: "{{ state_attr('climate.semyons_bedroom_ac_tuya', 'swing_modes') }}"
        swing_mode: "{{ state_attr('climate.semyons_bedroom_ac_tuya', 'swing_mode') }}"
        set_swing_mode:
          - action: climate.set_swing_mode
            target:
              entity_id: climate.semyons_bedroom_ac_tuya
            data:
              swing_mode: "{{ swing_mode }}"

        swing_horizontal_modes: "{{ state_attr('climate.semyons_bedroom_ac_tuya', 'swing_horizontal_modes') }}"
        swing_horizontal_mode: "{{ state_attr('climate.semyons_bedroom_ac_tuya', 'swing_horizontal_mode') }}"
        set_swing_horizontal_mode:
          - action: climate.set_swing_horizontal_mode
            target:
              entity_id: climate.semyons_bedroom_ac_tuya
            data:
              swing_horizontal_mode: "{{ swing_horizontal_mode }}"


# Вся логика кондиционера в спальне Семёна - одна автоматизация на блюпринте semyonchetvertnyh/ac_ir.yaml
# (объединены "AC - Follow Me" и "AC LED - Sleep"): Follow Me через ИК и LED, пока Семён спит.
# Тот же блюпринт - для гостиной и спальни Иры, когда там появятся RM4 Mini.
# Обёртка climate.semyons_bedroom_ac - выше в этом файле,
# переключатель LED - в packages/climate/ac_led.yaml (template-блюпринт semyonchetvertnyh/ac_led.yaml).
# План: Notion "Кондиционер по датчику у кровати".
automation:
  - alias: "Semyon’s Bedroom AC"
    id: semyons_bedroom_ac
    description: >
      Follow Me: передаёт кондиционеру в спальне Семёна температуру датчика у кровати через ИК
      (Broadlink) при каждом изменении датчика и раз в 2 минуты, в любом режиме.
      LED: гасит LED кондиционера, пока Семён спит.
    use_blueprint:
      path: semyonchetvertnyh/ac_ir.yaml
      input:
        temperature_sensor: sensor.semyons_bedroom_temperature
        remote: remote.semyons_bedroom
        climate: climate.semyons_bedroom_ac
        update_interval: "/2"
        asleep_sensor: binary_sensor.semyon_asleep
        led_switch: switch.semyons_bedroom_ac_led
