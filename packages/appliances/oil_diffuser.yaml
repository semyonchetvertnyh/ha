humidifier:
  - platform: humidifier_template
    name: "Semyon’s Bedroom Oil Diffuser"
    unique_id: "semyons_bedroom_oil_diffuser"

    current_humidity_template: "{{ states('sensor.irynas_bedroom_humidity') }}"
    target_humidity_template: 100
    min_humidity: 40
    max_humidity: 100

    state_template: >
      {{ is_state('select.semyons_bedroom_oil_diffuser_spray', 'on') or
        is_state('select.semyons_bedroom_oil_diffuser_spray', 'eco') }}
    set_state_action:
      - action: select.select_option
        target:
          entity_id: select.semyons_bedroom_oil_diffuser_spray
        data:
          option: >
            {{ "eco" if is_state('select.semyons_bedroom_oil_diffuser_spray', 'off') else "off" }}

    mode_template: >
      {{ "Heavy Spray" if states('select.semyons_bedroom_oil_diffuser_spray') == 'on' else "Light Spray" }}
    modes:
      - "Light Spray"
      - "Heavy Spray"
    set_mode_action:
      - action: select.select_option
        target:
          entity_id: select.semyons_bedroom_oil_diffuser_spray
        data:
          option: >
            {{ "on" if mode == 'Heavy Spray' else "eco" }}

