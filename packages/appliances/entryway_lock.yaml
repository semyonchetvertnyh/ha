timer:
  entryway_lock:
    name: Entryway Lock
    icon: mdi:lock
    restore: true

automation:
  # Синк Tedee (lock.entryway) <-> HomeKey-ESP32 (v0.9) через MQTT.
  # На ридере должны быть включены: Always Unlock on HomeKey (тап никогда не запирает,
  # эха "1" на тап нет), SmartLock Battery Reporting; Dummy Mode (Dumb Switch) - включен.
  - alias: Entryway Lock - Apple HomeKey Reader
    id: entryway_lock_apple_homekey_reader
    # без delay/wait прогоны занимают миллисекунды; queued, чтобы не терять события
    mode: queued
    max: 10

    triggers:
      - trigger: state
        entity_id: sensor.entryway_lock_battery
        not_to: [unavailable, unknown]
        id: battery_changed

      - trigger: state
        entity_id: lock.entryway
        to: null # Any state (ignoring attribute changes)
        id: physical_changed

      # Полу-заперт: Tedee в unknown + semi_locked on. Мимолетный semi_locked
      # при переходах (~0.4 с) отсекаем задержкой
      - trigger: state
        entity_id: binary_sensor.entryway_lock_semi_locked
        to: "on"
        for: "00:00:02"
        id: semi_locked

      # ридер вернулся онлайн (перезагрузка, переподключение, старт HA - LWT retained)
      - trigger: mqtt
        topic: entryway_lock_homekey/status
        payload: online
        id: reader_online

      - trigger: mqtt
        topic: entryway_lock_homekey/homekit/state
        id: homekey_command

      # Тап HomeKey (телефон/часы). Обычные NFC-метки (homekey: false) игнорируем
      - trigger: mqtt
        topic: entryway_lock_homekey/homekey/auth
        value_template: "{{ value_json.homekey | default(false) }}"
        payload: "True"
        id: homekey_tap

    variables:
      # unknown + semi_locked = полу-заперт, считаем отдельным стабильным состоянием
      physical: >-
        {% set s = states('lock.entryway') | lower %}
        {{ 'semi_locked' if s == 'unknown' and is_state('binary_sensor.entryway_lock_semi_locked', 'on') else s }}
      # Tedee менялся меньше 3 сек назад - значит пришло эхо нашей же синхронизации,
      # тап, который уже обрабатывается, или старт HA с retained-сообщением
      physical_settled: >-
        {{ (now() - states.lock.entryway.last_changed).total_seconds() > 3 }}

    actions:
      - choose:

          # =========================
          # BATTERY -> HOMEKEY
          # =========================
          - alias: Update battery level via MQTT
            conditions: "{{ trigger.id == 'battery_changed' }}"
            sequence:
              - action: mqtt.publish
                data:
                  topic: entryway_lock_homekey/homekit/set_battery_lvl
                  payload: "{{ trigger.to_state.state | int }}"
                  qos: 1
                  retain: true

          # =========================
          # PHYSICAL -> HOMEKEY
          # =========================
          # стабильные состояния - одним set_state (current + target сразу, без мигания),
          # переходные - только target, недоступность - только current
          - alias: Physical lock changed / reader online -> sync HomeKey
            # semi_locked по physical_changed не шлем - ждем триггер semi_locked (2 с)
            conditions: >-
              {{ trigger.id in ['physical_changed', 'semi_locked', 'reader_online']
                 and not (trigger.id == 'physical_changed' and physical == 'semi_locked') }}
            sequence:
              - choose:
                  # полу-заперт для HomeKit = не заперт (Unsecured)
                  - conditions: "{{ physical in ['unlocked', 'open', 'semi_locked', 'locked'] }}"
                    sequence:
                      - action: mqtt.publish
                        data:
                          topic: entryway_lock_homekey/homekit/set_state
                          payload: "{{ 1 if physical == 'locked' else 0 }}"
                          qos: 1

                  - conditions: "{{ physical in ['unlocking', 'opening', 'locking'] }}"
                    sequence:
                      - action: mqtt.publish
                        data:
                          topic: entryway_lock_homekey/homekit/set_target_state
                          payload: "{{ 1 if physical == 'locking' else 0 }}"
                          qos: 1

                  - conditions: "{{ physical == 'jammed' }}"
                    sequence:
                      - action: mqtt.publish
                        data:
                          topic: entryway_lock_homekey/homekit/set_current_state
                          payload: "2"
                          qos: 1

                  # unknown у Tedee бывает мимолетным между состояниями - его не шлем
                  - conditions: "{{ physical == 'unavailable' }}"
                    sequence:
                      - action: mqtt.publish
                        data:
                          topic: entryway_lock_homekey/homekit/set_current_state
                          payload: "3"
                          qos: 1

              # после перезагрузки ридера отдаем и батарею
              - if: "{{ trigger.id == 'reader_online' and states('sensor.entryway_lock_battery') | is_number }}"
                then:
                  - action: mqtt.publish
                    data:
                      topic: entryway_lock_homekey/homekit/set_battery_lvl
                      payload: "{{ states('sensor.entryway_lock_battery') | int }}"
                      qos: 1
                      retain: true

          # =========================
          # HOMEKEY TAP, ДВЕРЬ НЕ ЗАПЕРТА -> OPEN
          # =========================
          # С Always Unlock ридер на тап в unlocked ничего не публикует в state,
          # приходит только auth. Тап по запертой двери обработает ветка ниже (cmd 0)
          - alias: HomeKey tap while unlocked -> open
            conditions: >-
              {{ trigger.id == 'homekey_tap'
                 and physical in ['unlocked', 'open', 'semi_locked']
                 and physical_settled }}
            sequence:
              - action: lock.open
                target:
                  entity_id: lock.entryway

          # =========================
          # HOMEKEY -> PHYSICAL (Home app, Siri, тап по запертой двери)
          # =========================
          - alias: HomeKey command -> physical lock
            conditions: >-
              {{ trigger.id == 'homekey_command'
                 and trigger.payload in ['0', '1']
                 and physical in ['locked', 'unlocked', 'open', 'semi_locked']
                 and physical_settled }}
            sequence:
              - choose:
                  - conditions: "{{ trigger.payload == '0' and physical in ['locked', 'semi_locked'] }}"
                    sequence:
                      - action: lock.open
                        target:
                          entity_id: lock.entryway

                  - conditions: "{{ trigger.payload == '1' and physical in ['unlocked', 'open', 'semi_locked'] }}"
                    sequence:
                      - action: lock.lock
                        target:
                          entity_id: lock.entryway
