# Сон жильцов - фаза 1.
# Схема и требования: Claude Docs "Фазы суток в Home Assistant".
#
# Кто спит:
#   binary_sensor.semyon_asleep   - Семён спит
#   binary_sensor.iryna_asleep    - Ира спит
#   binary_sensor.residents_asleep - спят все, кто дома
# Рамки (время живёт только здесь, автоматизации на них не смотрят):
#   binary_sensor.bedtime_window  - 20:00-04:00, только в ней сигнал "лёг" считается
#   binary_sensor.wakeup_window   - 04:00-11:00, только в ней сигнал "встал" считается
# Страховки: в 04:00 все, кто дома, считаются спящими; в 11:00 - проснувшимися.

binary_sensor:
  - platform: tod
    name: Bedtime Window
    unique_id: bedtime_window
    after: "20:00:00"
    before: "04:00:00"

  - platform: tod
    name: Wakeup Window
    unique_id: wakeup_window
    after: "04:00:00"
    before: "11:00:00"

template:
  # Семён
  # Лёг: весь свет в спальне (включая подсветку монитора) выключен, за столом никого,
  #   а он в спальне - 5 минут подряд, в вечерней рамке.
  # Не спит: сидит за столом 15 минут (работает ночью) - в любое время.
  #   15 минут, потому что датчик стола ночью ложно видит кого-то на 3-10 минут (25.10, 27.10, 30.10).
  # Встал: открыл штору в спальне, в утренней рамке.
  #   Кофеварку убрали 31.10: её может включить кто угодно (гости), пока Семён спит.
  # Страховка 04:00 не срабатывает, если он в этот момент за столом или в спальне горит свет.
  - triggers:
      - trigger: state
        entity_id: binary_sensor.desk_occupancy
        to: "on"
        for: "00:15:00"
        id: desk
      - trigger: template
        value_template: >
          {{ is_state('light.semyons_bedroom', 'off')
             and is_state('light.desk_monitor_bar', 'off')
             and is_state('binary_sensor.desk_occupancy', 'off')
             and is_state('binary_sensor.semyons_bedroom_occupancy', 'on') }}
        for: "00:05:00"
        id: bed
      - trigger: state
        entity_id: cover.semyons_bedroom_shade
        from: "closed"
        to: ["opening", "open"]
        id: up
      - trigger: state
        entity_id: binary_sensor.bedtime_window
        from: "on"
        to: "off"
        id: bed_fallback
      - trigger: state
        entity_id: binary_sensor.wakeup_window
        from: "on"
        to: "off"
        id: up_fallback
      - trigger: state
        entity_id: person.semyon
        id: presence
    binary_sensor:
      - name: Semyon Asleep
        unique_id: semyon_asleep
        icon: mdi:sleep
        state: >
          {% set was = this.state == 'on' %}
          {% set bed = is_state('binary_sensor.bedtime_window', 'on') %}
          {% set wake = is_state('binary_sensor.wakeup_window', 'on') %}
          {% if not is_state('person.semyon', 'home') %}
            false
          {% elif trigger.id == 'bed' %}
            {{ bed or was }}
          {% elif trigger.id == 'up' %}
            {{ was and not wake }}
          {% elif trigger.id == 'desk' %}
            false
          {% elif trigger.id == 'bed_fallback' %}
            {{ was or not (is_state('binary_sensor.desk_occupancy', 'on')
                           or is_state('light.desk_monitor_bar', 'on')
                           or is_state('light.semyons_bedroom', 'on')) }}
          {% elif trigger.id == 'up_fallback' %}
            false
          {% else %}
            {{ was }}
          {% endif %}

  # Ира
  # Легла: в вечерней рамке в её спальне погас ВЕСЬ свет (Glow, верхний, прикроватная) - 2 минуты подряд.
  #   Glow должен быть выключен человеком, а не автоматизацией: 30.10 в 20:30 автосвет
  #   ("Lights - Iryna's Bedroom") погасил Glow, потому что датчик присутствия потерял Иру, а она не спала.
  #   Ночные кормления (Glow вкл/выкл) сон не сбрасывают.
  # Не спит: включила верхний свет (ночью она пользуется только Glow; лампу не берём - она сама включается ночью из-за бага).
  # Встала: открыла штору в спальне, в утренней рамке.
  - triggers:
      - trigger: template
        value_template: >
          {{ is_state('light.irynas_bedroom_speakers_glow', 'off')
             and is_state('light.irynas_bedroom_ceiling', 'off')
             and is_state('light.irynas_bedside_lamp', 'off')
             and states.light.irynas_bedroom_speakers_glow.context.parent_id is none }}
        for: "00:02:00"
        id: bed
      - trigger: state
        entity_id: light.irynas_bedroom_ceiling
        from: "off"
        to: "on"
        id: light_on
      - trigger: event
        event_type: event_template_reloaded
        id: recheck
      - trigger: state
        entity_id: cover.irynas_bedroom_shade
        from: "closed"
        to: ["opening", "open"]
        id: up
      - trigger: state
        entity_id: binary_sensor.bedtime_window
        from: "on"
        to: "off"
        id: bed_fallback
      - trigger: state
        entity_id: binary_sensor.wakeup_window
        from: "on"
        to: "off"
        id: up_fallback
      - trigger: state
        entity_id: person.iryna
        id: presence
    binary_sensor:
      - name: Iryna Asleep
        unique_id: iryna_asleep
        icon: mdi:sleep
        state: >
          {% set was = this.state == 'on' %}
          {% set bed = is_state('binary_sensor.bedtime_window', 'on') %}
          {% set wake = is_state('binary_sensor.wakeup_window', 'on') %}
          {% if not is_state('person.iryna', 'home') %}
            false
          {% elif trigger.id == 'bed' %}
            {{ bed or was }}
          {% elif trigger.id == 'light_on' %}
            false
          {% elif trigger.id == 'recheck' %}
            {{ was and is_state('light.irynas_bedroom_ceiling', 'off') }}
          {% elif trigger.id == 'up' %}
            {{ was and not wake }}
          {% elif trigger.id == 'bed_fallback' %}
            true
          {% elif trigger.id == 'up_fallback' %}
            false
          {% else %}
            {{ was }}
          {% endif %}

  # Спят все, кто дома. Никого нет дома - off.
  # Заменяет старое определение из residents.yaml (там было = binary_sensor.night).
  - binary_sensor:
      - name: Residents Asleep
        unique_id: residents_asleep
        icon: mdi:sleep
        state: >
          {% set s = is_state('person.semyon', 'home') %}
          {% set i = is_state('person.iryna', 'home') %}
          {{ (s or i)
             and (not s or is_state('binary_sensor.semyon_asleep', 'on'))
             and (not i or is_state('binary_sensor.iryna_asleep', 'on')) }}

automation:
  # Ночной режим AL по зонам - зеркалит датчики сна:
  #   Home (общие зоны) и Bathroom - пока спят все, кто дома (residents_asleep);
  #   Iryna's Bedroom - пока спит Ира (iryna_asleep).
  # Ванная: Bathroom-экземпляр ярче остальных (min_brightness 50%, закат +2 ч) для вечернего купания Каи;
  #   30.10 "пока спит хоть кто-то" делало ванную тёмной в 20:30, поэтому тоже по residents_asleep.
  # Заменяет старую UI-автоматизацию "Adaptive Lighting Sleep Mode" (по night/morning).
  - alias: Adaptive Lighting - Sleep Mode
    id: adaptive_lighting_sleep_mode
    mode: queued
    triggers:
      - trigger: state
        entity_id: binary_sensor.residents_asleep
        to: ["on", "off"]
        id: residents
      - trigger: state
        entity_id: binary_sensor.iryna_asleep
        to: ["on", "off"]
        id: iryna
    actions:
      - choose:
          - conditions:
              - condition: trigger
                id: residents
              - condition: state
                entity_id: binary_sensor.residents_asleep
                state: "on"
            sequence:
              # кто-то в ванной - не менять свет у него на глазах: сохранить и вернуть
              - if:
                  - condition: state
                    entity_id: binary_sensor.bathroom_occupancy
                    state: "on"
                then:
                  - action: scene.create
                    data:
                      scene_id: bathroom_downlights_before
                      snapshot_entities:
                        - light.bathroom
              - action: switch.turn_on
                target:
                  entity_id:
                    - switch.adaptive_lighting_sleep_mode
                    - switch.adaptive_lighting_bathroom_sleep_mode
              - if:
                  - condition: state
                    entity_id: binary_sensor.bathroom_occupancy
                    state: "on"
                then:
                  - action: scene.turn_on
                    target:
                      entity_id: scene.bathroom_downlights_before
          - conditions:
              - condition: trigger
                id: residents
            sequence:
              - action: switch.turn_off
                target:
                  entity_id:
                    - switch.adaptive_lighting_sleep_mode
                    - switch.adaptive_lighting_bathroom_sleep_mode
          - conditions:
              - condition: trigger
                id: iryna
              - condition: state
                entity_id: binary_sensor.iryna_asleep
                state: "on"
            sequence:
              - action: switch.turn_on
                target:
                  entity_id: switch.adaptive_lighting_iryna_s_bedroom_sleep_mode
          - conditions:
              - condition: trigger
                id: iryna
            sequence:
              - action: switch.turn_off
                target:
                  entity_id: switch.adaptive_lighting_iryna_s_bedroom_sleep_mode

  # Первый проснувшийся утром - открыть шторы в гостиной. Спальня второго не трогается.
  - alias: Sleep - First Wake
    id: sleep_first_wake
    mode: single
    triggers:
      - trigger: state
        entity_id: binary_sensor.residents_asleep
        from: "on"
        to: "off"
    conditions:
      # не срабатывать, если "все спят" погасло ночью из-за того, что кто-то пришёл домой
      - condition: state
        entity_id: binary_sensor.wakeup_window
        state: "on"
    actions:
      - action: cover.open_cover
        target:
          entity_id: cover.living_room_shade

