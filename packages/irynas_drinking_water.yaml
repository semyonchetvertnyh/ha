# Goal: 10 glasses (1600 ml)

automation:
  - alias: "Notifications - Iryna’s Drinking Water"
    id: notifications_irynas_drinking_water
    mode: single
    triggers:
      - trigger: state
        entity_id:
          - schedule.irynas_drinking_water
        from: "off"
        to: "on"
    actions:
      - action: script.notify
        data:
          persons:
            - person.iryna
          description: Напомни Ире выпить стакан воды.
          announce: false

schedule:
