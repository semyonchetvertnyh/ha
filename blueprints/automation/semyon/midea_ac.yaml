  temperature: "{{ states(temperature_sensor) | float(none) }}"
  ir_code: >
    {% if temperature is none %}
      {{ none }}
    {% else %}
      {{ ir_codes.get([[temperature | round(0, 'common') | int, 0] | max, 37] | min) }}
    {% endif %}

actions:
  - choose:
      - alias: "Follow Me: send the sensor temperature"
        conditions:
          - condition: trigger
            id: follow_me
          - condition: template
            value_template: "{{ ir_code is not none }}"
        sequence:
          - action: remote.send_command
            target:
              entity_id: !input remote
            data:
              command: "{{ ir_code }}"

      - alias: "LED: turn off while asleep"
        conditions:
          - condition: trigger
            id: led_off
          - condition: template
            value_template: "{{ asleep_sensors | length > 0 and led_switches | length > 0 }}"
          - condition: state
            entity_id: !input asleep_sensor
            state: "on"
          - condition: climate.is_on
            target:
              entity_id: !input climate
            options:
              behavior: any
              for: "00:00:00"
        sequence:
          - action: switch.turn_off
            target:
              entity_id: !input led_switch
