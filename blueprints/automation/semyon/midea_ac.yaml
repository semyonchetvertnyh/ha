# Логика кондиционера Midea (Inventor, пульт RG10A) в одной комнате: Follow Me через ИК и LED ночью.
# Коды Follow Me взяты из блюпринта hamsando/HABlueprints midea_followme.yaml (V1.1).
# План: Notion "Кондиционер по датчику у кровати".
blueprint:
  name: Midea AC - Follow Me and LED
  description: >
    Follow Me: sends the temperature of a room sensor to a Midea AC as IR "FollowMe" codes
    through a Broadlink remote - whenever the rounded value changes and at least every update
    interval, in any mode. Whole degrees, 0-37 °C. A switched-off AC ignores the codes.

    LED (optional): turns the AC LED switch off while the sleep sensor is on - when the person
    falls asleep or when the AC is switched on during sleep. The switch-on trigger waits 1.5 s
    so the LED switch can register that the LED lit up.
  domain: automation
  homeassistant:
    min_version: 2026.4.0
  source_url: https://github.com/semyonchetvertnyh/ha/blob/main/blueprints/automation/semyon/midea_ac.yaml
  input:
    temperature_sensor:
      name: Temperature sensor
      description: Sensor to mirror as Follow Me input (not the AC itself).
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: temperature
    remote:
      name: IR remote
      description: Broadlink remote that sends the codes.
      selector:
        entity:
          filter:
            - domain: remote
    climate:
      name: AC
      description: Climate entity of the AC (used for the LED).
      selector:
        entity:
          filter:
            - domain: climate
    update_interval:
      name: Update interval
      description: Resend the current Follow Me code at least this often.
      default: /2
      selector:
        select:
          mode: dropdown
          options:
            - label: Every 1 minute
              value: /1
            - label: Every 2 minutes
              value: /2
    asleep_sensor:
      name: Sleep sensor (optional)
      description: Binary sensor that is on while the person in this room sleeps. Leave empty to skip the LED part.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: binary_sensor
    led_switch:
      name: AC LED switch (optional)
      description: Switch that turns the AC LED on and off. Leave empty to skip the LED part.
      default: []
      selector:
        entity:
          multiple: true
          filter:
            - domain: switch

mode: queued
max: 5
max_exceeded: silent

triggers:
  - trigger: state
    entity_id: !input temperature_sensor
    not_to: ["unavailable", "unknown"]
    id: follow_me
  - trigger: time_pattern
    minutes: !input update_interval
    id: follow_me
  - trigger: state
    entity_id: !input asleep_sensor
    not_from: ["unavailable", "unknown"]
    to: "on"
    id: led_off
  - trigger: state
    entity_id: !input climate
    from: "off"
    not_to: ["unavailable", "unknown"]
    for:
      seconds: 1
      milliseconds: 500
    id: led_off

variables:
  temperature_sensor: !input temperature_sensor
  asleep_sensors: !input asleep_sensor
  led_switches: !input led_switch
