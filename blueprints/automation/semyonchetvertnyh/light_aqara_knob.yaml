blueprint:
  name: Aqara Knob - Light control
  description: "Blueprint for controlling dimmable lights with an Aqara Knob (Zigbee2MQTT).\n\nThe
    flow:\n  - Single press - if any light is on, turn all off; otherwise turn all
    on\n  - Double press - maximum brightness and a cool color\n  - Hold - low brightness
    and a warm color\n  - Rotation - adjusts brightness up and down\n  - Press & rotate
    - adjusts color temperature up and down\n\n\nTriggers on the knob's Zigbee2MQTT
    device topic, so action, rotation speed and button state come from one message
    (no race between entities). Target individual lights (not a Hue room) if Adaptive
    Lighting manages them.\n"
  domain: automation
  input:
    target_light:
      name: Target light(s)
      description: Light(s) to control (have to support brightness and color temperature).
      selector:
        target:
          entity:
          - domain:
            - light
    knob_topic:
      name: Knob - Zigbee2MQTT topic
      description: Device topic of the knob, e.g. zigbee2mqtt/Iryna’s Bedroom Knob
      selector:
        text:
          multiline: false
          multiple: false
mode: parallel
max: 6
max_exceeded: silent
triggers:
- trigger: mqtt
  topic: !input knob_topic
variables:
  light_target: !input target_light
  light_entities: '{% set e = light_target.entity_id | default([]) %} {{ [e] if e
    is string else e | list }}

    '
  light_entity: '{{ light_entities | first | default(none) }}'
  knob_action: '{{ trigger.payload_json.action | default('''') }}'
  rotation_speed: '{{ trigger.payload_json.action_rotation_angle_speed | default(0)
    | float(0) }}'
  button_pressed: '{{ trigger.payload_json.action_rotation_button_state | default('''')
    == ''pressed'' }}'
conditions:
- '{{ knob_action in [''single'', ''double'', ''hold'', ''rotation''] }}'
actions:
- choose:
  - alias: Single press - all off if any is on, otherwise all on
    conditions: '{{ knob_action == ''single'' }}'
    sequence:
    - if: '{{ light_entities | select(''is_state'', ''on'') | list | count > 0 }}'
      then:
      - action: light.turn_off
        target: !input target_light
        data:
          transition: 1
      else:
      - action: light.turn_on
        target: !input target_light
        data:
          transition: 1
  - alias: Double press - maximum brightness, cool color
    conditions: '{{ knob_action == ''double'' }}'
    sequence:
    - action: light.turn_on
      target: !input target_light
      data:
        color_temp_kelvin: '{{ state_attr(light_entity, ''max_color_temp_kelvin'')
          | int(6500) }}'
        brightness_pct: 100
        transition: 1
  - alias: Hold - low brightness, warm color
    conditions: '{{ knob_action == ''hold'' }}'
    sequence:
    - action: light.turn_on
      target: !input target_light
      data:
        color_temp_kelvin: '{{ state_attr(light_entity, ''min_color_temp_kelvin'')
          | int(2200) }}'
        brightness_pct: 1
        transition: 1
  - alias: Rotation - brightness
    conditions: '{{ knob_action == ''rotation'' and not button_pressed }}'
    sequence:
    - action: light.turn_on
      target: !input target_light
      data:
        brightness_step: '{{ (rotation_speed * 0.3) | round(0) | int }}'
        transition: 0.25
  - alias: Press & rotate - color temperature
    conditions: '{{ knob_action == ''rotation'' and button_pressed }}'
    sequence:
    - variables:
        current_kelvin: '{{ state_attr(light_entity, ''color_temp_kelvin'') | float(2700)
          }}'
        kelvin_delta: '{{ (rotation_speed * -5) | round(0) }}'
        target_kelvin: '{{ ([2000, current_kelvin + kelvin_delta, 6500] | sort)[1]
          | int }}'
    - action: light.turn_on
      target: !input target_light
      data:
        color_temp_kelvin: '{{ target_kelvin }}'
        transition: 0.4
